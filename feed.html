<style>
:root{--bg:#0d0b0b;--panel:#161313;--line:#352f2f;--fg:#f4eee7;--mute:#a89f97;--red:#ff3a2d;--paper:#f4eee7;--ink:#0d0b0b;
 --f-display:'Unbounded','Arial Black',system-ui,sans-serif;--f-body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;--f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);padding:22px max(16px,env(safe-area-inset-left,0px)) 80px}
.wrap{max-width:1240px;margin:0 auto}
h1{margin:0;font:900 clamp(22px,4vw,34px)/1.1 var(--f-display)}
p{margin:0}a{color:var(--fg)}
:focus-visible{outline:3px solid var(--paper);outline-offset:2px}
.hd{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 24px;margin-bottom:6px}
.sub{color:var(--mute)}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.st{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--red);padding:8px 14px;border-radius:3px}
.st b{display:block;font:900 22px var(--f-display)}.st span{color:var(--mute);font-size:12.5px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 16px}
.hint{color:var(--mute);font-size:12.5px}
.btn{font:700 14px var(--f-body);padding:9px 14px;border:0;background:var(--red);color:var(--ink);cursor:pointer;border-radius:3px;box-shadow:3px 3px 0 var(--paper);text-decoration:none;display:inline-block}
.btn.sm{padding:7px 11px;font-size:13px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.ghost[aria-pressed="true"]{border-color:var(--red);color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;min-width:0}
.tag{display:inline-block;font:700 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--mute);color:var(--mute);border-radius:2px}
.tag.hot{border-color:var(--red);color:var(--red)}
.hookline{font-weight:700}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line)}
.fdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;align-items:start}
.fdgrid>.hint,.fdgrid>.empty{grid-column:1/-1}
.vcard{display:grid;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.vtop{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 8px;min-height:20px}
.vb{font:700 12px var(--f-body);padding:4px 10px;border-radius:999px;background:#2a1210;color:var(--red);border:1px solid #5a1a14}
.vb.mute{background:#1b1616;color:var(--mute);border-color:var(--line)}
.vb.tr{background:#1d1a2e;color:#b9a8ff;border-color:#3b3366}
.vmedia{position:relative;aspect-ratio:9/16;background:#050404;overflow:hidden}
.vmedia.vm-ig{aspect-ratio:7/10}
.vmedia.vm-ig iframe{bottom:auto;height:820px}
.vmedia iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;color-scheme:light}
.vposter{position:absolute;inset:0;display:grid;align-content:space-between;justify-items:start;padding:16px;color:var(--paper);text-decoration:none;background:radial-gradient(circle at 75% 18%,rgba(255,58,45,.5),transparent 55%),linear-gradient(160deg,#1c1313,#0b0909)}
.vmult{font:900 52px var(--f-display);line-height:1}
.vplay{justify-self:center;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.14);position:relative}
.vplay::after{content:"";position:absolute;left:28px;top:20px;border-left:22px solid var(--paper);border-top:15px solid transparent;border-bottom:15px solid transparent}
.vhook{font:700 15px/1.35 var(--f-body);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.vmeta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:10px 12px 2px}
.vchip{font:800 11px var(--f-mono);padding:3px 6px;border-radius:5px;color:#fff}
.vc-ig{background:linear-gradient(45deg,#f9a03f,#d6249f,#5b51d8)}.vc-yt{background:#e62117}.vc-tg{background:#229ed9}
.vh{font:700 14px var(--f-body)}
.vstat{margin-left:auto;font:400 12px var(--f-mono);color:var(--mute)}
.vcap{margin:0;padding:6px 12px;font-size:13.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vsum{margin:0;padding:0 12px 8px;font-size:13px;line-height:1.5;color:var(--mute)}
.vsum:not([hidden])~.vbtn{border-top:1px solid var(--line)}
.vbtn{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 12px;align-items:center}
.vbtn .btn{text-decoration:none}

</style></head><body>

  var html=(feedBlocked?'<p class="hint">Браузер не пускает встроенные плееры с: '+esc(Object.keys(feedBlockedHosts).join(', '))+'. Нажми на превью, откроется оригинал.</p>':'')+items.map(function(x){
    if(x.kind==='video')return vcard(x);
    var u=safeUrl(x.url),t=esc(x.title||'без названия'),meta=[];
    if(x.source)meta.push(esc(x.source));if(x.date)meta.push(esc(fmtDate(x.date)));
    return '<article class="card"><div><span class="tag '+(x.kind==='news'?'hot':'')+'">'+esc(FK[x.kind]||'запись')+'</span> <span class="hint">'+meta.join(' · ')+'</span></div><h3 style="margin:0;font-size:16px">'+(u?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+t+'</a>':t)+'</h3>'+(x.hook?'<p class="hookline">«'+esc(x.hook)+'»</p>':'')+(x.summary?'<p class="hint" style="font-size:13.5px">'+esc(x.summary)+'</p>':'')+'<div><button class="btn ghost sm" data-act="hide" data-id="'+esc(x.id)+'">Скрыть</button></div></article>';
  }).join('');
  if(!items.length)html='<div class="empty">В этом разделе пусто.</div>';
  if(el._h!==html){el._h=html;el.innerHTML=html}
}
(function(){
  var V=FEED_SEED.filter(function(x){return x.kind==='video'}),last='';FEED_SEED.forEach(function(x){if(String(x.added||'')>last)last=String(x.added)});
  document.getElementById('upd').textContent=last?'обновлено '+new Date(last).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}):'';
  document.getElementById('stats').innerHTML=[[V.length,'видео в разборе'],[V.filter(function(x){return x.verdict==='viral'}).length,'вирусных'],[V.filter(function(x){return x.trend}).length,'на разгоне']].map(function(a){return'<div class="st"><b>'+a[0]+'</b><span>'+a[1]+'</span></div>'}).join('');
})();
document.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.f){filter=b.dataset.f;render();return}
  if(b.id==='sort'){feedSort=feedSort==='date'?'mult':'date';render();return}
  if(b.id==='pl'){feedPlayers=!feedPlayers;try{localStorage.setItem('kz-players',feedPlayers?'1':'0')}catch(e){}render();return}
  if(b.id==='unhide'){hidden=[];try{localStorage.setItem('kz-hidden','[]')}catch(e){}render();return}
  var a=b.dataset.act;
  if(a==='feed-hide'||a==='hide'){if(hidden.indexOf(b.dataset.id)<0)hidden.push(b.dataset.id);try{localStorage.setItem('kz-hidden',JSON.stringify(hidden))}catch(e){}render();return}
  if(a==='feed-more'){var vs=b.closest('.vcard').querySelector('.vsum');vs.hidden=!vs.hidden;b.textContent=vs.hidden?'Разбор':'Свернуть';return}
  if(a==='feed-script'){var x=FEED_SEED.find(function(z){return z.id===b.dataset.id});if(x){var t=(x.hook?x.hook+'. ':'')+(x.title||'');try{navigator.clipboard.writeText(t);b.textContent='Хук скопирован'}catch(e){b.textContent='Не вышло'}setTimeout(function(){b.textContent='Взять тему'},1800)}}
});
render();
</script></body></html>
